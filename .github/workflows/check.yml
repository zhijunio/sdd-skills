name: check

on:
  push:
    paths:
      - 'skills/**'
      - 'scripts/**'
      - '**/*.md'
      - '.github/workflows/check.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'scripts/**'
      - '**/*.md'
      - '.github/workflows/check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify skill package contracts
        run: |
          chmod +x scripts/check-skills.sh
          ./scripts/check-skills.sh
