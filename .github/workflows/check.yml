name: check

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Thirteen skills present
        run: test "$(find skills -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l)" -eq 13

      - name: Retired skill ids absent and sdd-ship present
        run: |
          for id in sdd-improve sdd-zoom sdd-worktree sdd-publish sdd-explain sdd-onboard sdd-readme sdd-agents sdd-repo-docs using-sdd git-release; do
            test ! -e "skills/$id"
          done
          test -f skills/sdd-ship/SKILL.md

      - name: Every prompt registered in README
        run: |
          for p in .github/prompts/*.prompt.md; do
            grep -q "$(basename "$p")" README.md
          done
