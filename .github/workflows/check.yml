name: check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nine skills present
        run: test "$(find skills -mindepth 2 -maxdepth 2 -name SKILL.md | wc -l)" -eq 9
